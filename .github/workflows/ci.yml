name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Restore
        run: dotnet restore IranValidator.slnx

      - name: Build
        run: dotnet build IranValidator.slnx -c Release --no-restore

      # coverlet.msbuild enforces the 95% line/branch/method threshold from
      # IranValidator.Tests.csproj — a dip below it fails this step.
      - name: Test (coverage threshold enforced)
        run: dotnet test IranValidator.slnx -c Release --no-build --logger "GitHubActions"

      # Smoke test on the lowest supported TFM: proves all six packages compile
      # and run on the real net8.0 runtime (the net10-only AspNetCore/MinimalApis
      # packages get their net8.0 asset exercised here).
      - name: Smoke test (.NET 8)
        run: dotnet run --project tests/IranValidator.Net8Smoke -c Release --no-build

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: tests/TestResults/
          if-no-files-found: ignore
