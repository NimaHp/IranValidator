name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub Release
  packages: write # publish to GitHub Packages
  pull-requests: read
  id-token: write # NuGet Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget-publish # created on first run; add approval rule + NUGET_USER secret there
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      # Single source of truth for the package version: the git tag (v1.2.3 -> 1.2.3).
      # Local builds fall back to VersionPrefix in Directory.Build.props.
      - name: Resolve package version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -oP '(?<=<VersionPrefix>)[^<]+' Directory.Build.props || echo '1.2.0')"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore IranValidator.slnx

      - name: Build
        run: dotnet build IranValidator.slnx -c Release --no-restore -p:Version="$VERSION"

      # Release gate: the full suite must stay green on the exact tag being published.
      - name: Test (coverage threshold enforced)
        run: dotnet test IranValidator.slnx -c Release --no-build --logger "GitHubActions"

      - name: Pack
        id: pack
        run: |
          for p in Core Localization DataAnnotations FluentValidation AspNetCore MinimalApis; do
            dotnet pack "src/IranValidator.$p/IranValidator.$p.csproj" -c Release --no-build --no-restore -o artifacts -p:Version="$VERSION"
          done

      - name: Push to GitHub Packages
        if: always() && github.ref_type == 'tag' && steps.pack.outcome == 'success'
        run: dotnet nuget push 'artifacts/*.nupkg' --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate

      - name: NuGet login (OIDC -> temp API key)
        if: always() && github.ref_type == 'tag' && steps.pack.outcome == 'success'
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }} # nuget.org profile name (not email)

      - name: Push to NuGet.org
        if: always() && github.ref_type == 'tag' && steps.pack.outcome == 'success'
        run: dotnet nuget push 'artifacts/*.nupkg' --source https://api.nuget.org/v3/index.json --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate

      - name: Prepare release notes
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          {
            printf '## IranValidator %s\n\n' "$VERSION"
            printf '### فارسی\n\n'
            awk -v version="$VERSION" '$0 ~ "^## \\[" version "\\]" { found=1; next } found && /^## \\[/ { exit } found' CHANGELOG.md
            printf '\n### English\n\n'
            awk -v version="$VERSION" '$0 ~ "^## \\[" version "\\]" { found=1; next } found && /^## \\[/ { exit } found' CHANGELOG.en.md
          } > /tmp/iranvalidator-release-notes.md
          test -s /tmp/iranvalidator-release-notes.md

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg --notes-file /tmp/iranvalidator-release-notes.md --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Keep the version text in the READMEs in sync with the released tag
      # ("— نسخه 1.2.3" / "— 1.2.3" on line 3). The NuGet/release badges update
      # themselves; this keeps the literal text current on main. Pushes made
      # with GITHUB_TOKEN do not re-trigger workflows, so no loop is possible.
      - name: Bump README version text
        if: github.ref_type == 'tag'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "3s/[0-9][0-9.]*/$VERSION/" README.md
          sed -i "3s/[0-9][0-9.]*/$VERSION/" README.en.md
          git config user.name "NimaHp"
          git config user.email "12736825+NimaHp@users.noreply.github.com"
          git add README.md README.en.md
          if git diff --cached --quiet; then
            echo "README already current ($VERSION); nothing to commit."
          else
            git commit -m "docs: bump README version text to $VERSION"
            git push origin HEAD:main || echo "::warning::README bump not pushed (main moved since tag?)"
          fi
